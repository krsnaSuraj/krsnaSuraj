<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="auto">
  <style>
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}
    @keyframes load{0%{width:0}}
    .p{animation:pulse 2s ease-in-out infinite}
    .l1{animation:load 1.5s ease-out 0.5s forwards}
    .l2{animation:load 1.8s ease-out 0.8s forwards}
    .l3{animation:load 2s ease-out 1.1s forwards}
    .l4{animation:load 2.2s ease-out 1.4s forwards}
  </style>
  <rect width="800" height="240" fill="#0d1117" rx="10"/>
  <rect width="800" height="240" fill="none" stroke="#21262d" stroke-width="1" rx="10"/>
  <text x="25" y="30" fill="#39d353" font-family="'Courier New',monospace" font-size="12" font-weight="bold">STATUS</text>
  <line x1="25" y1="38" x2="775" y2="38" stroke="#21262d" stroke-width="1"/>

  <circle cx="25" cy="62" r="5" fill="#39d353" class="p"/>
  <text x="40" y="67" fill="#c9d1d9" font-family="'Courier New',monospace" font-size="13">system: online · 24/7</text>

  <text x="25" y="98" fill="#8b949e" font-family="'Courier New',monospace" font-size="12">stack:</text>
  <rect x="85" y="84" width="280" height="18" rx="4" fill="#161b22"/>
  <rect x="85" y="84" width="252" height="18" rx="4" fill="#39d353" opacity="0.25" class="l1"/>
  <text x="225" y="97" fill="#0d1117" font-family="'Courier New',monospace" font-size="10" font-weight="bold" text-anchor="middle">Go · Kubernetes · Linux · Docker · OSS</text>

  <text x="25" y="130" fill="#8b949e" font-family="'Courier New',monospace" font-size="12">build:</text>
  <rect x="85" y="116" width="280" height="18" rx="4" fill="#161b22"/>
  <rect x="85" y="116" width="196" height="18" rx="4" fill="#58a6ff" opacity="0.25" class="l2"/>
  <text x="225" y="129" fill="#0d1117" font-family="'Courier New',monospace" font-size="10" font-weight="bold" text-anchor="middle">Shipping · PRs · Issues · Reviews</text>

  <text x="25" y="162" fill="#8b949e" font-family="'Courier New',monospace" font-size="12">focus:</text>
  <rect x="85" y="148" width="280" height="18" rx="4" fill="#161b22"/>
  <rect x="85" y="148" width="140" height="18" rx="4" fill="#ffbd2e" opacity="0.2" class="l3"/>
  <text x="225" y="161" fill="#0d1117" font-family="'Courier New',monospace" font-size="10" font-weight="bold" text-anchor="middle">Building in Public</text>

  <text x="25" y="194" fill="#8b949e" font-family="'Courier New',monospace" font-size="12">motto:</text>
  <rect x="85" y="180" width="280" height="18" rx="4" fill="#161b22"/>
  <rect x="85" y="180" width="280" height="18" rx="4" fill="#28c840" opacity="0.2" class="l4"/>
  <text x="225" y="193" fill="#0d1117" font-family="'Courier New',monospace" font-size="10" font-weight="bold" text-anchor="middle">Boring is Beautiful · Simple Ships</text>

  <rect x="400" y="48" width="375" height="178" rx="6" fill="#161b22"/>
  <text x="415" y="68" fill="#8b949e" font-family="'Courier New',monospace" font-size="11">pulse</text>
  <line x1="415" y1="75" x2="760" y2="75" stroke="#21262d" stroke-width="1"/>
  <g transform="translate(415, 90)">
    <rect x="0" y="55" width="24" height="25" rx="3" fill="#39d353" opacity="0.5"><animate attributeName="height" values="0;25" dur="1s" fill="freeze"/></rect>
    <rect x="30" y="40" width="24" height="40" rx="3" fill="#39d353" opacity="0.6"><animate attributeName="height" values="0;40" dur="1.2s" fill="freeze"/></rect>
    <rect x="60" y="25" width="24" height="55" rx="3" fill="#39d353" opacity="0.8"><animate attributeName="height" values="0;55" dur="1.4s" fill="freeze"/></rect>
    <rect x="90" y="50" width="24" height="30" rx="3" fill="#39d353" opacity="0.4"><animate attributeName="height" values="0;30" dur="1.6s" fill="freeze"/></rect>
    <rect x="120" y="15" width="24" height="65" rx="3" fill="#39d353" opacity="0.9"><animate attributeName="height" values="0;65" dur="1.8s" fill="freeze"/></rect>
    <rect x="150" y="35" width="24" height="45" rx="3" fill="#39d353" opacity="0.7"><animate attributeName="height" values="0;45" dur="2s" fill="freeze"/></rect>
    <rect x="180" y="55" width="24" height="25" rx="3" fill="#39d353" opacity="0.5"><animate attributeName="height" values="0;25" dur="2.2s" fill="freeze"/></rect>
    <rect x="210" y="40" width="24" height="40" rx="3" fill="#39d353" opacity="0.6"><animate attributeName="height" values="0;40" dur="2.4s" fill="freeze"/></rect>
    <rect x="240" y="10" width="24" height="70" rx="3" fill="#39d353" opacity="1"><animate attributeName="height" values="0;70" dur="2.6s" fill="freeze"/></rect>
    <rect x="270" y="25" width="24" height="55" rx="3" fill="#39d353" opacity="0.8"><animate attributeName="height" values="0;55" dur="2.8s" fill="freeze"/></rect>
    <rect x="300" y="50" width="24" height="30" rx="3" fill="#39d353" opacity="0.4"><animate attributeName="height" values="0;30" dur="3s" fill="freeze"/></rect>
    <rect x="330" y="30" width="24" height="50" rx="3" fill="#39d353" opacity="0.7"><animate attributeName="height" values="0;50" dur="3.2s" fill="freeze"/></rect>
  </g>
  <rect x="755" y="225" width="8" height="10" fill="#39d353" class="p"/>
</svg>